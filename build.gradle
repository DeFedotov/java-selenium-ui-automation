plugins {
    id 'java'
    id("io.qameta.allure") version "4.3.0"
}

group = 'fiadotau'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.45.0'
    testImplementation 'org.aeonbits.owner:owner:1.0.4'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    implementation 'io.qameta.allure:allure-junit5:2.35.4'
}

test {
    useJUnitPlatform()
    systemProperties(System.getProperties())
}

tasks.register('smokeTest', Test) {
    group = 'verification'
    description = 'Runs smoke tests'

    testClassesDirs = tasks.test.testClassesDirs
    classpath = tasks.test.classpath

    useJUnitPlatform(){
        includeTags 'smoke'
    }
}

tasks.register('noDefectsTests', Test) {
    group = 'verification'
    description = 'Runs only working tests'

    testClassesDirs = tasks.test.testClassesDirs
    classpath = tasks.test.classpath

    useJUnitPlatform(){
//        includeTags 'smoke'
        excludeTags 'defect'
    }
}
